<div class="main-container">
    <button mat-button (click)="openDrawer()">+ Add Student</button>
    <table mat-table [dataSource]="dataSource" class="mat-elevation-z8">
    
      <ng-container matColumnDef="studentId">
        <th mat-header-cell *matHeaderCellDef> PRN </th>
        <td mat-cell *matCellDef="let element"> {{element.studentId}} </td>
      </ng-container>
    
      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef> First Name </th>
        <td mat-cell *matCellDef="let element"> {{element.name}} </td>
      </ng-container>

      <ng-container matColumnDef="lastName">
        <th mat-header-cell *matHeaderCellDef> Last Name </th>
        <td mat-cell *matCellDef="let element"> {{element.lastName}} </td>
      </ng-container>

      <ng-container matColumnDef="gender">
        <th mat-header-cell *matHeaderCellDef> Gender </th>
        <td mat-cell *matCellDef="let element"> {{element.gender}}</td>
      </ng-container>


      <ng-container matColumnDef="email">
        <th mat-header-cell *matHeaderCellDef> Email </th>
        <td mat-cell *matCellDef="let element"> {{element.email}} </td>
      </ng-container>
      
    
      <ng-container matColumnDef="standard">
        <th mat-header-cell *matHeaderCellDef> Standard </th>
        <td mat-cell *matCellDef="let element"> {{element.standard}} th</td>
      </ng-container>
    
      <ng-container matColumnDef="dob">
        <th mat-header-cell *matHeaderCellDef> Date Of Birth </th>
        <td mat-cell *matCellDef="let element"> {{element.dob | date}} </td>
      </ng-container>

      <ng-container matColumnDef="action">
        <th mat-header-cell *matHeaderCellDef>Action </th>
        <td mat-cell *matCellDef="let element"> 
            <div class="action-container">
                <mat-icon class="edit" (click)="openDrawer(element)" aria-hidden="false" aria-label="Example edit icon" fontIcon="edit"></mat-icon>
                <mat-icon class="delete" (click)="onDelete(element.studentId)" aria-hidden="false" aria-label="Example delete icon" fontIcon="delete"></mat-icon>
            </div>
        </td>
      </ng-container>
    
      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

    </table>
  </div>

  <app-info-dialog (drawerClose)="onDrawerClose($event)"></app-info-dialog>
